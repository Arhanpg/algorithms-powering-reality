<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <style>
    .bg{fill:#111827}.panel{fill:#1f2937;stroke:#374151;stroke-width:2}.title{font:700 34px Arial;fill:#f9fafb}.sub{font:600 18px Arial;fill:#93c5fd}.label{font:700 17px Arial;fill:#f9fafb}.small{font:400 14px Arial;fill:#d1d5db}.circle{fill:#2563eb}.line{stroke:#60a5fa;stroke-width:3}.badge{fill:#0f766e}.badgeText{font:700 15px Arial;fill:#ecfeff}
  </style>
</defs>
<rect width="1200" height="620" class="bg"/>
<text x="50" y="65" class="title">Algorithms Powering Reality</text>
<text x="50" y="98" class="sub">9 algorithm families • from classic computer science to modern AI</text>

<g transform="translate(40 135)">
<rect width="350" height="190" rx="18" class="panel"/>
<text x="22" y="40" class="label">01 • Sorting</text>
<text x="22" y="70" class="small">Ordering data efficiently</text>
<circle cx="80" cy="125" r="22" class="circle"/><text x="74" y="131" class="badgeText">7</text>
<circle cx="145" cy="105" r="22" class="circle"/><text x="139" y="111" class="badgeText">3</text>
<circle cx="210" cy="140" r="22" class="circle"/><text x="204" y="146" class="badgeText">6</text>
<circle cx="275" cy="115" r="22" class="circle"/><text x="269" y="121" class="badgeText">1</text>
<text x="22" y="168" class="small">Search • ranking • databases • scheduling</text>
</g>

<g transform="translate(425 135)">
<rect width="350" height="190" rx="18" class="panel"/>
<text x="22" y="40" class="label">02 • Dijkstra</text>
<text x="22" y="70" class="small">Shortest paths in weighted graphs</text>
<circle cx="65" cy="125" r="18" class="circle"/><circle cx="145" cy="95" r="18" class="circle"/><circle cx="225" cy="125" r="18" class="circle"/><circle cx="290" cy="95" r="18" class="circle"/>
<line x1="83" y1="120" x2="127" y2="100" class="line"/><line x1="163" y1="101" x2="207" y2="119" class="line"/><line x1="243" y1="119" x2="272" y2="101" class="line"/>
<text x="22" y="168" class="small">Maps • navigation • network routing</text>
</g>

<g transform="translate(810 135)">
<rect width="350" height="190" rx="18" class="panel"/>
<text x="22" y="40" class="label">03 • Transformers</text>
<text x="22" y="70" class="small">Learning context across sequences</text>
<rect x="45" y="98" width="115" height="45" rx="10" class="badge"/><text x="76" y="126" class="badgeText">Encode</text>
<rect x="190" y="98" width="115" height="45" rx="10" class="badge"/><text x="222" y="126" class="badgeText">Decode</text>
<line x1="160" y1="120" x2="190" y2="120" class="line"/>
<text x="22" y="168" class="small">LLMs • translation • code generation</text>
</g>

<g transform="translate(40 360)">
<rect width="250" height="190" rx="18" class="panel"/><text x="22" y="40" class="label">04 • Link Analysis</text><text x="22" y="75" class="small">Rank nodes using graph structure</text><text x="22" y="108" class="small">Search • recommendations</text></g>
<g transform="translate(315 360)">
<rect width="250" height="190" rx="18" class="panel"/><text x="22" y="40" class="label">05 • RSA</text><text x="22" y="75" class="small">Public-key cryptography</text><text x="22" y="108" class="small">Secure communication</text></g>
<g transform="translate(590 360)">
<rect width="250" height="190" rx="18" class="panel"/><text x="22" y="40" class="label">06 • Factorization</text><text x="22" y="75" class="small">Break integers into factors</text><text x="22" y="108" class="small">Number theory • cryptography</text></g>
<g transform="translate(865 360)">
<rect width="295" height="190" rx="18" class="panel"/><text x="22" y="40" class="label">07–09 • More foundations</text><text x="22" y="75" class="small">CNN • Huffman Coding</text><text x="22" y="101" class="small">Secure Hash Algorithms</text><text x="22" y="145" class="small">Vision • compression • integrity</text></g>
</svg>